services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: braess_api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: braess_web
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
